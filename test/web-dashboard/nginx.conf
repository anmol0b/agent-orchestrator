user www-data;
worker_processes 1;
events { worker_connections 256; }

http {
	# Emulates `tailscale serve --https=443 http://127.0.0.1:3011`: TLS out
	# front, plain HTTP to the authenticated LAN listener behind. Host is
	# preserved — the daemon's same-origin cookie/CSRF checks compare the
	# request Origin against it.
	map $http_upgrade $connection_upgrade {
		default upgrade;
		"" close;
	}

	server {
		listen 443 ssl;
		server_name ao-e2e.tailnet.test;

		ssl_certificate     /etc/nginx/tls/ao-e2e.crt;
		ssl_certificate_key /etc/nginx/tls/ao-e2e.key;

		location / {
			proxy_pass http://127.0.0.1:3011;
			proxy_http_version 1.1;
			proxy_set_header Host $host;
			proxy_set_header X-Forwarded-Proto https;
			# /mux is a WebSocket; /api/v1/events + notifications are SSE.
			proxy_set_header Upgrade $http_upgrade;
			proxy_set_header Connection $connection_upgrade;
			proxy_buffering off;
			proxy_read_timeout 3600s;
		}
	}
}
